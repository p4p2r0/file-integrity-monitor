[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "file-integrity-monitor"
version = "0.1.1"
description = "Real-time file and directory integrity monitor with SQLite logging."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "p4p2r0", email = "294768138+p4p2r0@users.noreply.github.com" }]
keywords = ["fim", "file-integrity-monitoring", "security", "watchdog", "cli", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Monitoring",
]
dependencies = ["watchdog>=4.0.0"]

[project.urls]
Homepage = "https://github.com/p4p2r0/file-integrity-monitor"
Issues = "https://github.com/p4p2r0/file-integrity-monitor/issues"

[project.scripts]
file-integrity-monitor = "file_integrity_monitor.cli:main"