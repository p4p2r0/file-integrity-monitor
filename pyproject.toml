[project]
name = "file-integrity-monitor"
version = "0.1.1"
description = "Real-time file and directory integrity monitor with SQLite logging."
readme = "README.md"
authors = [{ name = "p4p2r0", email = "294768138+p4p2r0@users.noreply.github.com" }]
requires-python = ">=3.8"
dependencies = ["watchdog>=4.0.0"]

[project.scripts]
file-integrity-monitor = "file_integrity_monitor.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
